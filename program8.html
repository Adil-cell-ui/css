<!DOCTYPE html>
<html>
<head>
<title>CSS Properties Example</title>
<style>
/* List properties */
ul {
  list-style-type: square;
  list-style-position: inside;
  background-color: #f0f8ff;
  padding: 10px;
}

/* Border properties */
p {
  border: 2px solid blue;
  padding: 10px;
  width: 250px;
}

/* Positioning properties */
.box {
  position: relative;
  left: 50px;
  top: 20px;
  background-color: lightgreen;
  padding: 10px;
}
</style>
</head>

<body>
<h2>CSS Properties Example</h2>

<h3>List Properties</h3>
<ul>
  <li>HTML</li>
  <li>CSS</li>
  <li>JavaScript</li>
</ul>

<h3>Border Properties</h3>
<p>This paragraph has a blue border.</p>

<h3>Positioning Properties</h3>
<div class="box">This box is positioned using CSS.</div>

</body>
</html>
